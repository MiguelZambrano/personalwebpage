<div id="app-agua" class="agua-wrap">
  <div id="agua-estado" class="agua-loading">Cargando datos de la oficina...</div>

  <div id="agua-contenido" style="display:none;">
    <!-- Tarjetas KPI -->
    <div class="agua-kpis" id="agua-kpis"></div>

    <!-- Navegación táctil -->
    <div class="agua-tabs">
      <button class="agua-tab active" data-tab="aportes">Aportes por persona</button>
      <button class="agua-tab" data-tab="resumen">Resumen y gráfico</button>
    </div>

    <!-- Panel Aportes -->
    <section id="panel-aportes" class="agua-panel active">
      <div class="agua-controles">
        <select id="select-mes" aria-label="Seleccionar mes"></select>
        <input type="search" id="buscar-nombre" placeholder="Buscar nombre...">
      </div>
      <label class="agua-check">
        <input type="checkbox" id="solo-activos" checked>
        Mostrar solo participantes de este mes
      </label>
      <div id="lista-aportes" class="agua-lista"></div>
    </section>

    <!-- Panel Resumen -->
    <section id="panel-resumen" class="agua-panel">
      <div class="agua-controles-resumen">
        <select id="select-anio" aria-label="Filtrar por año"></select>
      </div>
      <div class="agua-chart-box">
        <canvas id="grafico-saldo"></canvas>
      </div>
      <div id="lista-resumen" class="agua-lista"></div>
    </section>
  </div>
</div>

<style>
  .agua-wrap {
    --card: rgba(127, 127, 127, 0.08);
    --border: rgba(127, 127, 127, 0.22);
    --accent: #1b6e4b;
    --ok-bg: rgba(22, 163, 74, 0.16);
    --ok-txt: #15803d;
    --pend-bg: rgba(217, 119, 6, 0.16);
    --pend-txt: #b45309;
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 780px;
    margin: 1rem auto;
  }
  body.dark .agua-wrap,
  .dark .agua-wrap {
    --ok-txt: #4ade80;
    --pend-txt: #fbbf24;
    --accent: #34d399;
  }
  .agua-loading { text-align: center; padding: 2rem; opacity: 0.75; }
  .agua-kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .agua-kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem;
  }
  .agua-kpi small { display: block; font-size: 0.78rem; opacity: 0.75; }
  .agua-kpi strong { display: block; font-size: 1.45rem; margin-top: 0.2rem; }
  .agua-kpi span { font-size: 0.75rem; opacity: 0.7; }
  .agua-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .agua-tab {
    padding: 0.7rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .agua-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .agua-panel { display: none; }
  .agua-panel.active { display: block; }
  .agua-controles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .agua-controles-resumen {
    margin-bottom: 0.75rem;
  }
  @media (max-width: 500px) { .agua-controles { grid-template-columns: 1fr; } }
  .agua-controles select,
  .agua-controles input,
  .agua-controles-resumen select {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: inherit;
    font-size: 0.95rem;
    box-sizing: border-box;
  }
  .agua-check {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    opacity: 0.85;
    margin-bottom: 0.9rem;
    cursor: pointer;
  }
  .agua-lista { display: flex; flex-direction: column; gap: 0.55rem; }
  .agua-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }
  .agua-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }
  .agua-badge {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok-txt); }
  .badge-pend { background: var(--pend-bg); color: var(--pend-txt); }
  .badge-na { background: var(--card); opacity: 0.65; }
  .agua-meta { font-size: 0.82rem; opacity: 0.75; margin-top: 0.35rem; }
  .agua-nota {
    margin-top: 0.45rem;
    font-size: 0.83rem;
    padding: 0.4rem 0.6rem;
    border-left: 3px solid var(--accent);
    background: var(--card);
    border-radius: 4px;
  }
  .agua-chart-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem;
    margin-bottom: 1rem;
    height: 240px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(() => {
  const SHEET_ID = "1bkW1F3ymrEXjDdrKK374_5rbMxXPoDPInG02pyypy9Q";
  const urlCSV = (sheet) =>
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}`;

  const MESES_ES = [
    "enero","febrero","marzo","abril","mayo","junio",
    "julio","agosto","septiembre","octubre","noviembre","diciembre"
  ];

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { cell += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else cell += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(cell.trim()); cell = ""; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && next === '\n') i++;
          row.push(cell.trim());
          if (row.some(v => v !== "")) rows.push(row);
          row = []; cell = "";
        } else cell += c;
      }
    }
    if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
    return rows;
  }

  const toNum = (s) => parseFloat(String(s || "0").replace(/[^0-9.-]/g, "")) || 0;
  const money = (n) => `$${n.toFixed(2)}`;
  const capitalizar = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";

  let chartInstance = null;

  async function init() {
    try {
      const [csvAportes, csvResumen] = await Promise.all([
        fetch(urlCSV("Aportes")).then(r => r.text()),
        fetch(urlCSV("Resumen")).then(r => r.text())
      ]);

      const rawAportes = parseCSV(csvAportes);
      const rawResumen = parseCSV(csvResumen);

      // Procesar Aportes
      const headersA = rawAportes[0];
      const idxTotal = headersA.findIndex(h => h.toLowerCase() === "total");
      const meses = headersA.slice(1, idxTotal > 0 ? idxTotal : headersA.length);
      const personas = rawAportes.slice(1)
        .filter(r => r[0] && !r[0].toLowerCase().startsWith("total"))
        .map(r => ({
          nombre: r[0],
          pagos: Object.fromEntries(meses.map((m, i) => [m, (r[i + 1] || "").toUpperCase()])),
          total: idxTotal > 0 ? r[idxTotal] : ""
        }));

      // Procesar Resumen (detecta año escrito o lo infiere automáticamente)
      let anio = parseInt((meses[0] || "").match(/\d{4}/)?.[0] || "2025", 10);
      const resumen = rawResumen.slice(1).filter(r => r[0]).map((r, idx) => {
        let mesLabel = capitalizar(r[0]);
        const matchAnio = mesLabel.match(/\d{4}/);
        let anioReg;
        if (matchAnio) {
          anioReg = matchAnio[0];
        } else {
          if (idx > 0 && mesLabel.toLowerCase().startsWith("enero")) anio++;
          anioReg = String(anio);
          mesLabel = `${mesLabel} ${anioReg}`;
        }
        return {
          mes: mesLabel,
          anio: anioReg,
          saldoAnt: toNum(r[1]),
          aportes: toNum(r[2]),
          botellones: r[3] === "" ? null : parseInt(r[3], 10),
          gastoAgua: toNum(r[4]),
          gastosVarios: toNum(r[5]),
          saldoFinal: toNum(r[6]),
          notas: (r[7] && r[7] !== "-") ? r[7] : ""
        };
      });

      // Detectar mes y año actual
      const hoy = new Date();
      const anioHoy = String(hoy.getFullYear());
      const etiquetaHoy = `${MESES_ES[hoy.getMonth()]} ${anioHoy}`;
      const mesActual = meses.find(m => m.toLowerCase() === etiquetaHoy) || meses[meses.length - 1];

      // KPIs
      const regActual = resumen.find(r => r.mes.toLowerCase() === mesActual.toLowerCase()) || resumen[resumen.length - 1];
      const ultimoReg = resumen[resumen.length - 1];
      const notaAdelanto = ultimoReg.mes !== regActual.mes
        ? `Con adelantos (${ultimoReg.mes}): ${money(ultimoReg.saldoFinal)}`
        : `Actualizado a ${regActual.mes}`;

      document.getElementById("agua-kpis").innerHTML = `
        <div class="agua-kpi">
          <small>Saldo disponible (${regActual.mes})</small>
          <strong>${money(regActual.saldoFinal)}</strong>
          <span>${notaAdelanto}</span>
        </div>
        <div class="agua-kpi">
          <small>Aportes del mes</small>
          <strong>${money(regActual.aportes)}</strong>
          <span>Gastos: ${money(regActual.gastoAgua + regActual.gastosVarios)}</span>
        </div>
        <div class="agua-kpi">
          <small>Botellones (${regActual.mes})</small>
          <strong>${regActual.botellones ?? 0}</strong>
          <span>Agua: ${money(regActual.gastoAgua)}</span>
        </div>
      `;

      // Selector de meses (más reciente primero)
      const selMes = document.getElementById("select-mes");
      [...meses].reverse().forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        if (m === mesActual) opt.selected = true;
        selMes.appendChild(opt);
      });

      const renderAportes = () => {
        const m = selMes.value;
        const q = document.getElementById("buscar-nombre").value.toLowerCase().trim();
        const soloActivos = document.getElementById("solo-activos").checked;
        const cont = document.getElementById("lista-aportes");

        const filtrados = personas.filter(p => {
          const estado = p.pagos[m];
          if (soloActivos && estado !== "TRUE" && estado !== "FALSE") return false;
          if (q && !p.nombre.toLowerCase().includes(q)) return false;
          return true;
        });

        cont.innerHTML = filtrados.length ? filtrados.map(p => {
          const st = p.pagos[m];
          const badge = st === "TRUE"
            ? `<span class="agua-badge badge-ok">✓ Pagado</span>`
            : st === "FALSE"
              ? `<span class="agua-badge badge-pend">Pendiente</span>`
              : `<span class="agua-badge badge-na">No aplica</span>`;
          return `
            <div class="agua-item">
              <div class="agua-item-top">
                <strong>${p.nombre}</strong>
                ${badge}
              </div>
              <div class="agua-meta">Acumulado histórico: ${p.total || "—"}</div>
            </div>
          `;
        }).join("") : `<div class="agua-item">No se encontraron personas con ese filtro.</div>`;
      };

      selMes.addEventListener("change", renderAportes);
      document.getElementById("buscar-nombre").addEventListener("input", renderAportes);
      document.getElementById("solo-activos").addEventListener("change", renderAportes);
      renderAportes();

      // Selector de años para Resumen y Gráfico
      const aniosDisponibles = [...new Set(resumen.map(r => r.anio))].sort().reverse();
      const selAnio = document.getElementById("select-anio");

      aniosDisponibles.forEach(a => {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = `Año ${a}`;
        if (a === anioHoy) opt.selected = true;
        selAnio.appendChild(opt);
      });
      const optTodos = document.createElement("option");
      optTodos.value = "todos";
      optTodos.textContent = "Todos los años";
      selAnio.appendChild(optTodos);

      const renderResumen = () => {
        const filtroAnio = selAnio.value;
        const datos = filtroAnio === "todos"
          ? resumen
          : resumen.filter(r => r.anio === filtroAnio);

        document.getElementById("lista-resumen").innerHTML = [...datos].reverse().map(r => `
          <div class="agua-item">
            <div class="agua-item-top">
              <strong>${r.mes}</strong>
              <strong>Saldo: ${money(r.saldoFinal)}</strong>
            </div>
            <div class="agua-meta">
              Aportes: ${money(r.aportes)} · Botellones: ${r.botellones ?? "—"} (${money(r.gastoAgua)})
              ${r.gastosVarios > 0 ? ` · Varios: ${money(r.gastosVarios)}` : ""}
            </div>
            ${r.notas ? `<div class="agua-nota">${r.notas}</div>` : ""}
          </div>
        `).join("");

        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(document.getElementById("grafico-saldo"), {
          type: "line",
          data: {
            labels: datos.map(r =>
              filtroAnio === "todos"
                ? r.mes.replace(/ 20(\d\d)/, " '$1")
                : r.mes.replace(/ \d{4}/, "")
            ),
            datasets: [{
              label: "Saldo final ($)",
              data: datos.map(r => r.saldoFinal),
              borderColor: "#1b6e4b",
              backgroundColor: "rgba(27, 110, 75, 0.15)",
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
          }
        });
      };

      selAnio.addEventListener("change", renderResumen);
      renderResumen();

      // Tabs
      document.querySelectorAll(".agua-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".agua-tab, .agua-panel").forEach(el => el.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
        });
      });

      document.getElementById("agua-estado").style.display = "none";
      document.getElementById("agua-contenido").style.display = "block";
    } catch (err) {
      document.getElementById("agua-estado").textContent =
        "No se pudieron cargar los datos. Verifica que la hoja sea pública (Cualquier persona con el enlace puede ver).";
      console.error(err);
    }
  }

  init();
})();
</script>
