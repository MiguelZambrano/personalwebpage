<div id="app-agua" class="agua-wrap">
  <div id="agua-estado" class="agua-loading">Cargando datos de la oficina...</div>

  <div id="agua-contenido" style="display:none;">
    <!-- Tarjetas KPI -->
    <div class="agua-kpis" id="agua-kpis"></div>

    <!-- Navegación táctil -->
    <div class="agua-tabs">
      <button class="agua-tab active" data-tab="aportes">Aportes por persona</button>
      <button class="agua-tab" data-tab="resumen">Resumen y gráfico</button>
    </div>

    <!-- Panel Aportes -->
    <section id="panel-aportes" class="agua-panel active">
      <div class="agua-controles">
        <select id="select-mes" aria-label="Seleccionar mes"></select>
        <input type="search" id="buscar-nombre" placeholder="Buscar nombre...">
      </div>
      <label class="agua-check">
        <input type="checkbox" id="solo-activos" checked>
        Mostrar solo la gente que está actualmente en la oficina.
      </label>
      <div id="lista-aportes" class="agua-lista"></div>
    </section>

    <!-- Panel Resumen -->
    <section id="panel-resumen" class="agua-panel">
      <div class="agua-controles-resumen">
        <select id="select-anio" aria-label="Filtrar por año"></select>
      </div>
      <div class="agua-chart-box">
        <canvas id="grafico-saldo"></canvas>
      </div>
      <div id="lista-resumen" class="agua-lista"></div>
    </section>
  </div>
</div>

<style>
  .agua-wrap {
    --card: rgba(127, 127, 127, 0.08);
    --border: rgba(127, 127, 127, 0.22);
    --accent: #1b6e4b;
    --ok-bg: rgba(22, 163, 74, 0.16);
    --ok-txt: #15803d;
    --pend-bg: rgba(217, 119, 6, 0.16);
    --pend-txt: #b45309;
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 780px;
    margin: 1rem auto;
  }
  body.dark .agua-wrap,
  .dark .agua-wrap {
    --ok-txt: #4ade80;
    --pend-txt: #fbbf24;
    --accent: #34d399;
  }
  .agua-loading { text-align: center; padding: 2rem; opacity: 0.75; }
  .agua-kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .agua-kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem;
  }
  .agua-kpi small { display: block; font-size: 0.78rem; opacity: 0.75; }
  .agua-kpi strong { display: block; font-size: 1.45rem; margin-top: 0.2rem; }
  .agua-kpi span { font-size: 0.75rem; opacity: 0.7; }
  .agua-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .agua-tab {
    padding: 0.7rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .agua-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .agua-panel { display: none; }
  .agua-panel.active { display: block; }
  .agua-controles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .agua-controles-resumen { margin-bottom: 0.75rem; }
  @media (max-width: 500px) { .agua-controles { grid-template-columns: 1fr; } }
  .agua-controles select,
  .agua-controles input,
  .agua-controles-resumen select {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: inherit;
    font-size: 0.95rem;
    box-sizing: border-box;
  }
  .agua-check {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    opacity: 0.85;
    margin-bottom: 0.9rem;
    cursor: pointer;
  }
  .agua-lista { display: flex; flex-direction: column; gap: 0.55rem; }
  .agua-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }
  details.agua-item { padding: 0; }
  details.agua-item summary {
    list-style: none;
    cursor: pointer;
    padding: 0.75rem 0.9rem;
    user-select: none;
  }
  details.agua-item summary::-webkit-details-marker { display: none; }
  .agua-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }
  .agua-nombre-wrap {
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  .agua-chevron {
    font-size: 0.75rem;
    opacity: 0.6;
    transition: transform 0.2s ease;
    display: inline-block;
  }
  details.agua-item[open] .agua-chevron { transform: rotate(90deg); }
  .agua-badge {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok-txt); }
  .badge-pend { background: var(--pend-bg); color: var(--pend-txt); }
  .badge-na { background: var(--card); opacity: 0.65; }
  .agua-meta { font-size: 0.82rem; opacity: 0.75; margin-top: 0.35rem; }
  .agua-historial {
    padding: 0.65rem 0.9rem 0.85rem;
    border-top: 1px solid var(--border);
  }
  .agua-historial-titulo {
    font-size: 0.78rem;
    opacity: 0.75;
    margin-bottom: 0.45rem;
  }
  .agua-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .agua-chip {
    font-size: 0.76rem;
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    background: var(--ok-bg);
    color: var(--ok-txt);
    font-weight: 500;
  }
  .agua-nota {
    margin-top: 0.45rem;
    font-size: 0.83rem;
    padding: 0.4rem 0.6rem;
    border-left: 3px solid var(--accent);
    background: var(--card);
    border-radius: 4px;
  }
  .agua-chart-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem;
    margin-bottom: 1rem;
    height: 240px;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ "js/finanzas-agua.js" | relURL }}"></script>
